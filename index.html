<!DOCTYPE html>
<html lang="sn" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="author" content="Last Dulani">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AfroPDF</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e7a3c">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg:#fbf7ef;--fg:#1f2a1f;--card:#fff;--ac:#064733;--ac2:#f2b705;--bd:#d9d2c1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a14;--fg:#eef2ea;--card:#1d261d;--ac:#064733;--bd:#33402f}}
:root[data-theme="dark"]{--bg:#141a14;--fg:#eef2ea;--card:#1d261d;--ac:#064733;--bd:#33402f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{background:var(--ac);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;border-bottom:3px solid var(--ac2)}
h1{font-size:1rem;margin:0;flex:1;min-width:100px;cursor:pointer;letter-spacing:.2px}
.lg{flex:none;cursor:pointer;display:block;border-radius:9px;background:#fff;object-fit:contain;padding:2px}
header select,header button{background:none;border:1px solid #ffffff66;color:#fff}
header select{-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.14);color:#fff;padding:5px 24px 5px 10px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='white' d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 6px center;background-size:15px}
header select option{color:#1f2a1f;background:#fff}
button,select,input{font:inherit;font-size:.8rem;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;min-height:36px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600;font-size:.9rem}
button:disabled{opacity:.4}
#bar{display:none;gap:4px;padding:6px 8px;align-items:center;overflow-x:auto;border-bottom:1px solid var(--bd);background:var(--card)}
#bar button{flex:none;border:0;border-radius:8px;background:none;color:var(--fg);padding:6px 10px;white-space:nowrap}
#bar button.icon{min-width:38px;height:38px;display:grid;place-items:center;padding:0}
#bar button:active{background:var(--ac2);color:#1f2a1f}
#hlmode.active{background:var(--ac2);color:#1f2a1f}
.pgbox{flex:none;display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:8px;background:var(--card);padding:0 8px;min-height:36px;font-size:.8rem;cursor:text}
.pgbox:focus-within{border-color:var(--ac)}
#pg{border:0;background:transparent;padding:0;min-height:0;min-width:0;width:2.5ch;text-align:right;-moz-appearance:textfield;appearance:textfield;outline:0}
#pg::-webkit-inner-spin-button,#pg::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
main{flex:1;overflow:auto;padding:12px;text-align:center;position:relative;touch-action:pan-x pan-y}
#welcome{max-width:420px;margin:4vh auto;padding:24px;border:1px solid var(--bd);border-radius:14px;background:var(--card);box-shadow:0 2px 14px #0001}
#welcome.over{border:2px dashed var(--ac)}
#welcome h2{margin:0 0 8px}
#welcome p{margin:0 0 16px;opacity:.85}
#pages{position:relative;width:max-content;min-width:100%}
.pg{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 2px 10px #0003}
.pg canvas{display:block}
.textLayer{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;line-height:1;-webkit-user-select:text;user-select:text;z-index:1}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer ::selection{background:rgba(30,122,60,.35);color:transparent}
#recent{margin-top:18px;text-align:left}
#recent h3{font-size:.85rem;margin:0 0 6px;opacity:.8}
.row{display:flex;gap:6px;margin:6px 0}
.row .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msg{margin:12px;opacity:.85}
.credit{margin:18px 0 0;font-size:.75rem;opacity:.65}
#printArea{display:none}
#pdlg{display:none;position:fixed;inset:0;background:#0007;z-index:20;justify-content:flex-end;align-items:flex-end}
#pdlg.on{display:flex}
#pbox{background:var(--card);border:1px solid var(--bd);border-radius:16px 16px 0 0;width:100%;max-width:420px;margin:0 auto;max-height:80%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -6px 24px #0004}
@media (min-width:460px){#pdlg{align-items:center}#pbox{border-radius:16px;margin:16px}}
.dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--bd)}
.dh b{flex:1;font-size:1rem}
#pclose{border:0;background:none;color:var(--fg);font-size:22px;line-height:1;padding:0 4px;min-height:auto}
#pbody{padding:14px 16px}
#pbox label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;font-size:.85rem}
#pbox input{width:80px;text-align:center}
#pmsg{font-size:.8rem;opacity:.85;margin:8px 0 12px;min-height:1.2em}
#pmsg.err{opacity:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:88%;background:var(--fg);color:var(--bg);font-size:.8rem;padding:10px 16px;border-radius:10px;z-index:30;box-shadow:0 4px 14px #0005;text-align:center}
.pbtns{display:flex;gap:8px;justify-content:flex-end;padding:0 16px 16px}
#splash{position:fixed;inset:0;background:var(--ac);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;transition:opacity .4s ease}
#splash img{width:84px;height:84px;border-radius:18px;background:#fff;object-fit:contain;padding:6px}
#splash span{color:#fff;font-size:1.05rem;font-weight:600;letter-spacing:.3px}
#splash small{color:#ffffffcc;font-size:.75rem;margin-top:-8px}
#splash.hide{opacity:0;pointer-events:none}
@page{margin:8mm}
@media print{
 body>*:not(#printArea){display:none!important}
 html,body{height:auto;background:#fff;display:block}
 #printArea{display:block}
 #printArea img{display:block;margin:0 auto;max-width:100%;max-height:270mm;break-after:page;page-break-after:always}
}
#sbar{display:none;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--bd);background:var(--card)}
#sbar.on{display:flex}
#sbar input{flex:1;min-width:0}
#sbar button{flex:none;border:0;background:none;color:var(--fg);width:32px;height:32px;display:grid;place-items:center;border-radius:8px;padding:0}
#sbar button:active{background:var(--ac2);color:#1f2a1f}
#sclose{font-size:20px}
#smsg{font-size:.75rem;opacity:.75;white-space:nowrap}
.hlmark{position:absolute;background:rgba(242,183,5,.45);pointer-events:auto;cursor:pointer;border-radius:2px;z-index:2}
#hlbtn{position:fixed;z-index:25;border:0;border-radius:8px;background:var(--fg);color:var(--bg);width:34px;height:34px;display:grid;place-items:center;box-shadow:0 2px 8px #0004}
.err{color:#c0392b}
</style>
</head>
<body>
<div id="splash"><img src="icons/logo.png" alt="AfroPDF"><span data-i="appName"></span><small data-i="developedBy"></small></div>
<header>
  <img class="lg" id="lg" src="icons/logo.png" width="30" height="30" alt="AfroPDF">
  <h1 id="title"><span style="color:#fff">Afro</span><span style="color:var(--ac2)">PDF</span></h1>
  <select id="lang" aria-label="Language"></select>
  <button id="theme" aria-label="Light / Dark" title="Light / Dark"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="display:block"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
</header>
<div id="bar">
  <button id="open2" class="icon" aria-label="Open another" title="Open another"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="display:block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V6a1 1 0 0 1 1-1h5l2 2h7a1 1 0 0 1 1 1v3"/><path d="M3 19l3-8h16l-3 8z"/></svg></button>
  <button id="prev" data-i="prev"></button>
  <label class="pgbox"><input id="pg" type="number" min="1" aria-label="Page"><span id="tot"></span></label>
  <button id="next" data-i="next"></button>
  <button id="zo" data-i="zoomOut"></button>
  <button id="zi" data-i="zoomIn"></button>
  <button id="hlmode" class="icon" aria-label="Highlight" title="Highlight"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="display:block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l6-6 4 4-6 6H9v-4z"/><path d="M3 21h18"/></svg></button>
  <button id="hlundo" class="icon" hidden aria-label="Undo" title="Undo"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="display:block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4-4 4-4"/><path d="M5 10h11a4 4 0 0 1 0 8h-1"/></svg></button>
  <button id="hlredo" class="icon" hidden aria-label="Redo" title="Redo"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="display:block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l4-4-4-4"/><path d="M19 10H8a4 4 0 0 0 0 8h1"/></svg></button>
  <button id="search" class="icon" aria-label="Search" title="Search"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="display:block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
  <button id="print" class="icon" aria-label="Print" title="Print"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="display:block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3h10v6"/><path d="M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7" rx="1"/></svg></button>
  <button id="share" class="icon" aria-label="Share" title="Share"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="display:block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M8 8l4-4 4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></button>
</div>
<div id="sbar">
  <input id="sq" type="text" data-ph="search">
  <button id="sprev" aria-label="Previous match" title="Previous match"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg></button>
  <button id="snext" aria-label="Next match" title="Next match"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  <span id="smsg"></span>
  <button id="sclose" aria-label="Close">&times;</button>
</div>
<main id="main">
  <div id="welcome">
    <img src="icons/logo.png" width="72" height="72" alt="AfroPDF" style="margin-bottom:8px">
    <h2 data-i="welcome"></h2>
    <p data-i="tagline"></p>
    <button class="p" id="open" data-i="open"></button>
    <p style="margin-top:16px;font-size:.85rem" data-i="dropHint"></p>
    <p style="font-size:.8rem;opacity:.7" data-i="privacy"></p>
    <div id="recent" hidden><h3 data-i="recent"></h3><div id="rows"></div></div>
    <p class="credit" data-i="credit"></p>
  </div>
  <div id="msg"></div>
  <div id="pages" hidden></div>
</main>
<div id="printArea"></div>
<div id="pdlg"><div id="pbox" role="dialog" aria-modal="true">
  <div class="dh"><b data-i="print"></b><button id="pclose" aria-label="Close">&times;</button></div>
  <div id="pbody">
    <label><span data-i="printFrom"></span><input id="pf" type="number" min="1"></label>
    <label><span data-i="printTo"></span><input id="pt" type="number" min="1"></label>
    <div id="pmsg"></div>
  </div>
  <div class="pbtns"><button id="pcancel" data-i="cancel"></button><button class="p" id="pgo" data-i="print"></button></div>
</div></div>
<button id="hlbtn" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l6-6 4 4-6 6H9v-4z"/><path d="M3 21h18"/></svg></button>
<input type="file" id="file" accept="application/pdf" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
/* Interface text lives in locales/<code>.json. To add a language: add the file and one line to LANGS. */
var STR = {};
function ensure(l){
  if(STR[l]) return Promise.resolve();
  return fetch("locales/"+l+".json").then(function(r){ return r.json(); }).then(function(j){ STR[l]=j; });
}
var LANGS = {sn:"chiShona", nd:"isiNdebele", to:"chiTonga", ny:"Chichewa", en:"English"};
var lang = "sn";
try { lang = localStorage.getItem("lang") || "sn"; } catch(e){}
if(!LANGS[lang]) lang = "sn";
function t(k, v){
  var s = (STR[lang] && STR[lang][k]) || STR.en[k] || k;
  if(v) for(var x in v) s = s.replace("{"+x+"}", v[x]);
  return s;
}
var $ = function(i){return document.getElementById(i)};
var langSel=$("lang"), tot=$("tot"), pg=$("pg"), msg=$("msg"), main=$("main"), pagesEl=$("pages"), w=$("welcome");
var pdf=null, cur=1, scale=1, baseW=1, baseH=1, gen=0, fileKey="", obs=null, pageEls=[];

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(function(el){
    if(el.tagName==="BUTTON" && el.querySelector("svg")){ el.setAttribute("aria-label",t(el.dataset.i)); el.title=t(el.dataset.i); }
    else{ el.textContent = t(el.dataset.i); }
  });
  document.title = t("appName");
  $("theme").setAttribute("aria-label",t("theme")); $("theme").title=t("theme");
  $("open2").setAttribute("aria-label",t("openAnother")); $("open2").title=t("openAnother");
  $("print").setAttribute("aria-label",t("print")); $("print").title=t("print");
  $("share").setAttribute("aria-label",t("share")); $("share").title=t("share");
  $("search").setAttribute("aria-label",t("search")); $("search").title=t("search");
  $("hlmode").setAttribute("aria-label",t("highlight")); $("hlmode").title=t("highlight");
  $("hlundo").setAttribute("aria-label",t("undo")); $("hlundo").title=t("undo");
  $("hlredo").setAttribute("aria-label",t("redo")); $("hlredo").title=t("redo");
  $("sq").placeholder=t("search");
  if(pdf) tot.textContent = t("pageOf",{n:pdf.numPages});
  try { localStorage.setItem("lang", lang); } catch(e){}
  listRecent();
}
Object.keys(LANGS).forEach(function(k){
  var o=document.createElement("option"); o.value=k; o.textContent=LANGS[k]; langSel.appendChild(o);
});
langSel.value = lang;
langSel.onchange = function(){ var l=langSel.value; ensure(l).then(function(){ lang=l; applyLang(); }); };
try{ var savedTheme=localStorage.getItem("theme"); if(savedTheme) document.documentElement.setAttribute("data-theme",savedTheme); }catch(e){}
$("theme").onclick = function(){
  var r=document.documentElement, dark = getComputedStyle(r).getPropertyValue("--bg").trim()==="#141a14";
  var next = dark?"light":"dark";
  r.setAttribute("data-theme", next);
  try{ localStorage.setItem("theme", next); }catch(e){}
};

/* ---- Recent files, stored on the phone (IndexedDB) ---- */
function idb(){ return new Promise(function(res,rej){
  var r=indexedDB.open("afropdf",1);
  r.onupgradeneeded=function(){ r.result.createObjectStore("files",{keyPath:"key"}); };
  r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
});}
function saveRecent(file){
  idb().then(function(db){
    var tx=db.transaction("files","readwrite"), st=tx.objectStore("files");
    st.put({key:file.name+"|"+file.size, name:file.name, ts:Date.now(), blob:file});
    st.getAll().onsuccess=function(e){
      e.target.result.sort(function(a,b){return b.ts-a.ts}).slice(5).forEach(function(r){ st.delete(r.key); });
    };
  }).catch(function(){});
}
function lastPage(key){ try{ return parseInt(localStorage.getItem("pos:"+key),10)||1; }catch(e){ return 1; } }
function listRecent(){
  idb().then(function(db){
    db.transaction("files").objectStore("files").getAll().onsuccess=function(e){
      var rows=(e.target.result||[]).sort(function(a,b){return b.ts-a.ts}), box=$("rows");
      box.innerHTML=""; $("recent").hidden=!rows.length;
      rows.forEach(function(r){
        var d=document.createElement("div"); d.className="row";
        var b=document.createElement("button"); b.className="nm";
        b.textContent=r.name+" · "+t("page")+" "+lastPage(r.key);
        b.onclick=function(){ load(r.blob); };
        var x=document.createElement("button"); x.textContent="✕"; x.title=t("remove"); x.setAttribute("aria-label",t("remove"));
        x.onclick=function(){ idb().then(function(db2){ var tx=db2.transaction("files","readwrite"); tx.objectStore("files").delete(r.key); tx.oncomplete=listRecent; }); };
        d.appendChild(b); d.appendChild(x); box.appendChild(d);
      });
    };
  }).catch(function(){});
}

/* ---- Opening files ---- */
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
function pick(){ $("file").click(); }
$("open").onclick = pick; $("open2").onclick = pick;
$("file").onchange = function(e){ if(e.target.files[0]) load(e.target.files[0]); e.target.value=""; };
["dragover","dragenter"].forEach(function(ev){ document.body.addEventListener(ev,function(e){e.preventDefault(); w.classList.add("over");}); });
["dragleave","drop"].forEach(function(ev){ document.body.addEventListener(ev,function(e){e.preventDefault(); w.classList.remove("over");}); });
document.body.addEventListener("drop", function(e){ var f=e.dataTransfer.files[0]; if(f) load(f); });
function showWelcome(){ w.style.display=""; $("bar").style.display="none"; pagesEl.hidden=true; msg.textContent=""; curBlob=null; curName=""; hideHlBtn(); closeSearch(); listRecent(); }
$("lg").onclick=showWelcome; $("title").onclick=showWelcome;

function fail(k){ msg.className="err"; msg.textContent=t(k); }
function load(file){
  if(file.type!=="application/pdf" && !/\.pdf$/i.test(file.name||"")){ fail("notPdf"); return; }
  msg.className=""; msg.textContent=t("loading");
  var fr=new FileReader();
  fr.onload=function(){
    pdfjsLib.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(d){
      if(pdf){ try{pdf.destroy();}catch(e){} }
      clearPrint(); pdf=d; fileKey=file.name+"|"+file.size; curBlob=file; curName=file.name||"document.pdf"; hlLoad(); pageTextCache=[]; searchGen++;
      var start=lastPage(fileKey);
      saveRecent(file);
      return d.getPage(1).then(function(p){
        var v=p.getViewport({scale:1}); baseW=v.width; baseH=v.height;
        scale=Math.min(2,Math.max(.3,(main.clientWidth-24)/baseW));
        msg.textContent=""; w.style.display="none"; $("bar").style.display="flex"; pagesEl.hidden=false;
        pg.max=d.numPages; pg.style.width=(String(d.numPages).length+.5)+"ch"; tot.textContent=t("pageOf",{n:d.numPages});
        layout(Math.min(start,d.numPages));
      });
    }).catch(function(){ fail("error"); });
  };
  fr.readAsArrayBuffer(file);
}

/* ---- Continuous scrolling: pages are drawn only when near the screen ---- */
function freePage(el){
  el._on=false;
  if(el._rt){ try{el._rt.cancel();}catch(e){} el._rt=null; }
  if(el._tl){ try{el._tl.cancel();}catch(e){} el._tl=null; }
  var c=el.querySelector("canvas"); if(c){ c.width=c.height=0; }
  el.innerHTML="";
}
function drawPage(el){
  if(el._on) return; el._on=true; var g=gen;
  pdf.getPage(+el.dataset.n).then(function(p){
    if(!el._on || g!==gen) return;
    var dpr=Math.min(window.devicePixelRatio||1,2), vp=p.getViewport({scale:scale});
    var c=document.createElement("canvas");
    c.width=vp.width*dpr; c.height=vp.height*dpr;
    c.style.width=vp.width+"px"; c.style.height=vp.height+"px";
    el.style.width=vp.width+"px"; el.style.height=vp.height+"px";
    el.appendChild(c);
    el._rt=p.render({canvasContext:c.getContext("2d"),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null});
    var tl=document.createElement("div"); tl.className="textLayer"; el.appendChild(tl);
    renderHL(el, +el.dataset.n);
    p.getTextContent().then(function(tc){
      if(!el._on || g!==gen) return;
      el._tl=pdfjsLib.renderTextLayer({textContent:tc,container:tl,viewport:vp,textDivs:[]});
    }).catch(function(){});
    return el._rt.promise;
  }).catch(function(){});
}
function layout(goto){
  gen++;
  pageEls.forEach(freePage);
  if(obs) obs.disconnect();
  pagesEl.innerHTML=""; pageEls=[];
  obs=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting) drawPage(e.target); else freePage(e.target); });
  },{root:main,rootMargin:"100% 0px"});
  for(var i=1;i<=pdf.numPages;i++){
    var el=document.createElement("div"); el.className="pg"; el.dataset.n=i;
    el.style.width=baseW*scale+"px"; el.style.height=baseH*scale+"px";
    pagesEl.appendChild(el); pageEls.push(el); obs.observe(el);
  }
  goTo(goto);
}
function goTo(n){
  n=Math.max(1,Math.min(pdf.numPages,n));
  main.scrollTop=pagesEl.offsetTop+pageEls[n-1].offsetTop-8;
  setCur(n);
}
var saveT;
function setCur(n){
  cur=n; pg.value=n;
  $("prev").disabled=n<=1; $("next").disabled=!pdf||n>=pdf.numPages;
  clearTimeout(saveT);
  saveT=setTimeout(function(){ try{localStorage.setItem("pos:"+fileKey,cur);}catch(e){} },400);
}
var tick=false;
main.addEventListener("scroll",function(){
  hideHlBtn();
  if(tick||!pdf||!pageEls.length) return; tick=true;
  requestAnimationFrame(function(){
    tick=false;
    var pos=main.scrollTop+main.clientHeight*.25-pagesEl.offsetTop, lo=0, hi=pageEls.length-1;
    while(lo<hi){ var m=(lo+hi+1)>>1; if(pageEls[m].offsetTop<=pos) lo=m; else hi=m-1; }
    if(lo+1!==cur) setCur(lo+1);
  });
});
$("prev").onclick=function(){ goTo(cur-1); };
$("next").onclick=function(){ goTo(cur+1); };
pg.onchange=function(){ goTo(parseInt(pg.value,10)||1); };
function zoom(f){
  if(!pdf) return;
  var s=Math.max(.3,Math.min(4,scale*f)), n=cur;
  if(s===scale) return; scale=s; layout(n);
}
$("zi").onclick=function(){ zoom(1.25); };
$("zo").onclick=function(){ zoom(.8); };

/* Pinch to zoom: preview while pinching, redraw crisply when fingers lift */
var pinch=null;
function dist(e){ var a=e.touches[0], b=e.touches[1]; return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); }
main.addEventListener("touchstart",function(e){ if(pdf && e.touches.length===2) pinch={d:dist(e),r:1}; },{passive:true});
main.addEventListener("touchmove",function(e){
  if(!pinch||e.touches.length!==2) return;
  e.preventDefault();
  pinch.r=Math.max(.3/scale,Math.min(4/scale,dist(e)/pinch.d));
  pagesEl.style.transformOrigin="50% 0"; pagesEl.style.transform="scale("+pinch.r+")";
},{passive:false});
main.addEventListener("touchend",function(){
  if(!pinch) return; var r=pinch.r; pinch=null;
  pagesEl.style.transform="";
  if(Math.abs(r-1)>.03) zoom(r);
});
/* ---- Print (up to 50 pages): pages are drawn sharply in the background, then the print dialog opens ---- */
var pjob=0, pUrls=[], PMAX=50;
function clearPrint(){ pUrls.forEach(function(u){ URL.revokeObjectURL(u); }); pUrls=[]; $("printArea").innerHTML=""; }
function pBusy(b){ $("pf").disabled=$("pt").disabled=$("pgo").disabled=b; }
function openPrint(){
  if(!pdf) return; pjob++; clearPrint();
  $("pf").max=$("pt").max=pdf.numPages; $("pf").value=cur; $("pt").value=cur;
  $("pmsg").className=""; $("pmsg").textContent=t("printMax",{n:PMAX});
  pBusy(false); $("pdlg").classList.add("on");
}
function closePrint(){ pjob++; $("pdlg").classList.remove("on"); }
function doPrint(){
  var n=pdf.numPages, a=Math.max(1,parseInt($("pf").value,10)||1), b=Math.min(n,parseInt($("pt").value,10)||a);
  $("pf").value=a; $("pt").value=b;
  if(b<a || b-a+1>PMAX){ $("pmsg").className="err"; $("pmsg").textContent=t("printMax",{n:PMAX}); return; }
  var job=++pjob, i=a, area=$("printArea"); clearPrint(); pBusy(true);
  function next(){
    if(job!==pjob) return;
    if(i>b){ closePrint(); setTimeout(function(){ window.print(); },150); return; }
    $("pmsg").className=""; $("pmsg").textContent=t("preparing")+" "+(i-a+1)+"/"+(b-a+1);
    pdf.getPage(i).then(function(p){
      var v1=p.getViewport({scale:1}), s=Math.min(2,2200/Math.max(v1.width,v1.height)), vp=p.getViewport({scale:s});
      var c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
      var ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
      return p.render({canvasContext:ctx,viewport:vp}).promise.then(function(){
        return new Promise(function(res){ c.toBlob(res,"image/jpeg",.85); });
      }).then(function(bl){
        c.width=c.height=0;
        if(job!==pjob) return;
        var url=URL.createObjectURL(bl); pUrls.push(url);
        return new Promise(function(res){ var im=new Image(); im.onload=im.onerror=res; im.src=url; area.appendChild(im); });
      });
    }).then(function(){ i++; next(); }).catch(function(){
      if(job!==pjob) return; pBusy(false); $("pmsg").className="err"; $("pmsg").textContent=t("printFail");
    });
  }
  next();
}
$("print").onclick=openPrint; $("pcancel").onclick=closePrint; $("pclose").onclick=closePrint; $("pgo").onclick=doPrint;
$("pdlg").addEventListener("click",function(e){ if(e.target===this) closePrint(); });
/* ---- Share the open document ---- */
var curBlob=null, curName="";
function toast(msg){
  var old=document.getElementById("toast"); if(old) old.remove();
  var el=document.createElement("div"); el.id="toast"; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3500);
}
function fallbackShare(){
  try{
    var url=URL.createObjectURL(curBlob);
    var isIOS=/iP(hone|ad|od)/.test(navigator.userAgent||"");
    if(isIOS){
      /* Safari ignores the download attribute; opening the PDF lets the student use Safari's own share icon */
      window.open(url,"_blank");
    }else{
      var a=document.createElement("a"); a.href=url; a.download=curName||"document.pdf";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    setTimeout(function(){ URL.revokeObjectURL(url); },30000);
  }catch(e){}
  toast(t("shareUnsupported"));
}
function shareCurrent(){
  if(!curBlob) return;
  try{
    var f=null;
    try{ f=new File([curBlob], curName||"document.pdf", {type:"application/pdf"}); }catch(e){}
    if(f && navigator.canShare && navigator.canShare({files:[f]})){
      navigator.share({files:[f], title:curName}).catch(function(err){
        if(err && err.name==="AbortError") return; /* student cancelled on purpose */
        fallbackShare();
      });
      return;
    }
    fallbackShare();
  }catch(e){ fallbackShare(); }
}
$("share").onclick=shareCurrent;
/* ---- Search inside the open PDF (page by page, lazily) ---- */
var pageTextCache=[], searchGen=0;
function pageText(n){
  if(pageTextCache[n]!=null) return Promise.resolve(pageTextCache[n]);
  return pdf.getPage(n).then(function(p){ return p.getTextContent(); }).then(function(tc){
    var txt=tc.items.map(function(i){ return i.str; }).join(" ");
    pageTextCache[n]=txt; return txt;
  }).catch(function(){ return ""; });
}
function findMatch(term, from, dir, g){
  term=term.toLowerCase();
  function step(n, left){
    if(g!==searchGen) return null;
    if(left<=0) return null;
    n+=dir; if(n<1) n=pdf.numPages; if(n>pdf.numPages) n=1;
    return pageText(n).then(function(txt){
      if(g!==searchGen) return null;
      if(txt.toLowerCase().indexOf(term)>=0) return n;
      return step(n, left-1);
    });
  }
  return step(from, pdf.numPages);
}
function openSearch(){
  if(!pdf) return;
  $("sbar").classList.add("on"); $("sq").focus(); $("sq").select();
}
function closeSearch(){ searchGen++; $("sbar").classList.remove("on"); $("smsg").textContent=""; }
function doSearch(dir){
  var term=$("sq").value.trim(); if(!term || !pdf) return;
  var g=++searchGen;
  $("smsg").textContent=t("searching");
  pageText(cur).then(function(txt){
    if(g!==searchGen) return;
    if(txt.toLowerCase().indexOf(term.toLowerCase())>=0 && dir===0){ $("smsg").textContent=""; return; }
    return findMatch(term, cur, dir===0?1:dir, g).then(function(n){
      if(g!==searchGen) return;
      if(n==null){ $("smsg").textContent=t("noMatch"); return; }
      $("smsg").textContent=""; goTo(n);
    });
  }).catch(function(){
    if(g!==searchGen) return;
    $("smsg").textContent=t("noMatch");
  });
}
$("search").onclick=openSearch;
$("sclose").onclick=closeSearch;
$("snext").onclick=function(){ doSearch(1); };
$("sprev").onclick=function(){ doSearch(-1); };
$("sq").addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key==="ArrowDown") doSearch(1); if(e.key==="ArrowUp") doSearch(-1); if(e.key==="Escape") closeSearch(); });
$("sq").addEventListener("input",function(){ pageTextCache=pageTextCache.length?pageTextCache:[]; });

/* ---- Highlighting: stored as page + fraction-of-page rectangles, so it scales with zoom ---- */
var HL={}, hlModeOn=false, hlUndo=[], hlRedo=[];
function hlLoad(){
  HL={}; hlUndo=[]; hlRedo=[];
  try{ HL=JSON.parse(localStorage.getItem("hl:"+fileKey)||"{}"); }catch(e){ HL={}; }
  updateUndoRedoBtns();
}
function hlSave(){ try{ localStorage.setItem("hl:"+fileKey, JSON.stringify(HL)); }catch(e){} }
function refreshPageHL(n){
  var el=pageEls[n-1]; if(!el || !el._on) return;
  var marks=el.querySelectorAll(".hlmark"); marks.forEach(function(m){ m.remove(); });
  renderHL(el, n);
}
function renderHL(el, n){
  var list=HL[n]; if(!list) return;
  list.forEach(function(r){
    var d=document.createElement("div"); d.className="hlmark";
    d.style.left=(r.xf*100)+"%"; d.style.top=(r.yf*100)+"%"; d.style.width=(r.wf*100)+"%"; d.style.height=(r.hf*100)+"%";
    d.onclick=function(){ removeHighlight(n, r); };
    el.appendChild(d);
  });
}
/* internal mutators: change HL + persist + redraw, with no effect on the undo/redo stacks */
function _addRects(n, rects){ if(!HL[n]) HL[n]=[]; rects.forEach(function(r){ HL[n].push(r); }); hlSave(); refreshPageHL(n); }
function _removeRects(n, rects){
  rects.forEach(function(r){ var idx=HL[n]?HL[n].indexOf(r):-1; if(idx>-1) HL[n].splice(idx,1); });
  if(HL[n] && !HL[n].length) delete HL[n];
  hlSave(); refreshPageHL(n);
}
function updateUndoRedoBtns(){
  $("hlundo").disabled=!hlUndo.length; $("hlredo").disabled=!hlRedo.length;
}
function addHighlight(n, rects){
  if(!rects.length) return;
  _addRects(n, rects);
  hlUndo.push({type:"add", page:n, rects:rects}); hlRedo=[]; updateUndoRedoBtns();
}
function removeHighlight(n, r){
  _removeRects(n, [r]);
  hlUndo.push({type:"remove", page:n, rects:[r]}); hlRedo=[]; updateUndoRedoBtns();
}
function hlUndoOnce(){
  var a=hlUndo.pop(); if(!a) return;
  if(a.type==="add") _removeRects(a.page, a.rects); else _addRects(a.page, a.rects);
  hlRedo.push(a); updateUndoRedoBtns();
}
function hlRedoOnce(){
  var a=hlRedo.pop(); if(!a) return;
  if(a.type==="add") _addRects(a.page, a.rects); else _removeRects(a.page, a.rects);
  hlUndo.push(a); updateUndoRedoBtns();
}
$("hlundo").onclick=hlUndoOnce; $("hlredo").onclick=hlRedoOnce;
$("hlmode").onclick=function(){
  hlModeOn=!hlModeOn;
  $("hlmode").classList.toggle("active", hlModeOn);
  $("hlundo").hidden=!hlModeOn; $("hlredo").hidden=!hlModeOn;
  if(!hlModeOn) hideHlBtn();
};

var hlBtn=$("hlbtn"), hlRange=null, hlPageEl=null;
function hideHlBtn(){ hlBtn.hidden=true; hlRange=null; hlPageEl=null; }
document.addEventListener("selectionchange",function(){
  if(!hlModeOn){ hideHlBtn(); return; }
  var sel=window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount){ hideHlBtn(); return; }
  var node=sel.anchorNode, pageEl=node && node.nodeType===1?node.closest(".pg"):(node&&node.parentElement?node.parentElement.closest(".pg"):null);
  if(!pageEl){ hideHlBtn(); return; }
  hlRange=sel.getRangeAt(0).cloneRange(); hlPageEl=pageEl;
  var r=sel.getRangeAt(0).getBoundingClientRect();
  hlBtn.hidden=false;
  hlBtn.style.left=Math.max(4,r.left+r.width/2-17)+"px";
  hlBtn.style.top=Math.max(4,r.top-42+window.scrollY)+"px";
});
hlBtn.addEventListener("mousedown",function(e){ e.preventDefault(); }); /* keep selection alive until we read it */
hlBtn.addEventListener("click",function(){
  if(!hlRange || !hlPageEl) return;
  var n=+hlPageEl.dataset.n, pr=hlPageEl.getBoundingClientRect(), rects=hlRange.getClientRects(), add=[];
  Array.prototype.forEach.call(rects,function(rc){
    if(rc.width<1||rc.height<1) return;
    add.push({xf:(rc.left-pr.left)/pr.width, yf:(rc.top-pr.top)/pr.height, wf:rc.width/pr.width, hf:rc.height/pr.height});
  });
  addHighlight(n, add);
  window.getSelection().removeAllRanges();
  hideHlBtn();
});

document.addEventListener("keydown",function(e){
  if(!pdf||e.target===pg||e.target===$("sq")) return;
  if(e.key==="ArrowRight") goTo(cur+1);
  if(e.key==="ArrowLeft") goTo(cur-1);
});
ensure("en").then(function(){ return ensure(lang); }).catch(function(){ lang="en"; }).then(applyLang);
/* Splash screen: shows briefly on launch, then fades */
(function(){
  var el=document.getElementById("splash");
  function hide(){ el.classList.add("hide"); setTimeout(function(){ el.remove(); },450); }
  setTimeout(hide, 1800);
})();


/* Real Web Worker for PDF.js (fetched from the CDN once, then served from the offline cache) */
var WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
fetch(WORKER).then(function(r){ return r.text(); }).then(function(txt){
  pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([txt],{type:"text/javascript"}));
}).catch(function(){});

/* Offline support */
if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
